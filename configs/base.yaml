# Base configuration for TinyGPT experiments

model:
  d_model: 128
  n_layers: 6
  n_heads: 4
  mlp_ratio: 4
  vocab_size: 256  # character-level
  max_seq_len: 256
  dropout: 0.1

training:
  batch_size: 32
  lr: 3e-4
  weight_decay: 0.1
  max_steps: 5000
  grad_clip: 1.0
  device: cuda

dataset:
  name: "WikiText-2"
  tokenizer: "char"
  seq_len: 256

logging:
  log_dir: "outputs/logs"
  log_interval: 50
  save_checkpoints: true
  checkpoint_dir: "outputs/checkpoints"